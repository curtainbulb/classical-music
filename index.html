<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Canon — A Classical Music Curriculum</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Era navigation -->
  <nav id="era-nav" aria-label="Musical eras">
    <div id="era-nav-inner"></div>
  </nav>

  <!-- Progress indicator -->
  <div id="progress-bar-wrap" role="progressbar" aria-label="Listening progress">
    <div id="progress-bar"></div>
  </div>

  <!-- Utility bar: search + filters -->
  <div id="util-bar" role="search">
    <input
      id="search-input"
      type="search"
      placeholder="Search composer, title, form…"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      aria-label="Search works"
    >
    <button class="filter-btn" data-filter="phase" data-value="1" title="Phase 1 — no prior knowledge needed">Phase 1</button>
    <button class="filter-btn" data-filter="phase" data-value="2" title="Phase 2 — rewards some familiarity">Phase 2</button>
    <button class="filter-btn" data-filter="phase" data-value="3" title="Phase 3 — needs context from phases 1 and 2">Phase 3</button>
    <button class="filter-btn" data-filter="gateway" title="Gateway works — the best starting points">Gateway</button>
    <button class="filter-btn" data-filter="unlistened" title="Hide listened works">To hear</button>
  </div>

  <div id="progress-label" aria-live="polite"></div>

  <!-- Main content — era sections injected here by app.js -->
  <main id="main"></main>

  <script src="data/eras.js"></script>
  <script src="data/works.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
