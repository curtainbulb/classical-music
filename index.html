<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classical Music — Your Listening Journey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --ink: #1a1a18;
    --ink-soft: #4a4a44;
    --ink-muted: #8a8a80;
    --paper: #f7f4ee;
    --paper-warm: #f0ece2;
    --paper-card: #faf8f3;
    --rule: #d8d4c8;
    --gold: #b5923a;
    --gold-light: #f0e4c4;
    --green: #3a7a4a;
    --green-light: #e0f0e4;
    --phase1: #2a5c8a;
    --phase1-light: #e4eef8;
    --phase2: #7a4a8a;
    --phase2-light: #f0e8f4;
    --phase3: #8a3a3a;
    --phase3-light: #f4e8e8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 2.5rem 1.5rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 780px;
    margin: 0 auto;
  }

  .site-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 4px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 400;
    color: var(--paper);
    margin-bottom: 1rem;
  }

  .progress-bar-wrap {
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
    height: 3px;
    margin-bottom: 6px;
  }
  .progress-bar-fill {
    height: 3px;
    background: var(--gold);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }
  .progress-count { color: var(--gold); font-weight: 500; }

  /* SEARCH & FILTERS */
  .controls {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.25rem 1.5rem;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--rule);
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
  }

  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-muted);
    pointer-events: none;
  }

  input[type="search"] {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--paper-card);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
  }

  input[type="search"]:focus { border-color: var(--gold); }

  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }

  .filter-btn {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--rule);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: var(--ink-soft); }
  .filter-btn.active-p1 { background: var(--phase1-light); border-color: var(--phase1); color: var(--phase1); }
  .filter-btn.active-p2 { background: var(--phase2-light); border-color: var(--phase2); color: var(--phase2); }
  .filter-btn.active-p3 { background: var(--phase3-light); border-color: var(--phase3); color: var(--phase3); }
  .filter-btn.active-all { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .filter-btn.active-listened { background: var(--green-light); border-color: var(--green); color: var(--green); }

  /* MAIN */
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  /* PHASE SECTION */
  .phase-section { margin-bottom: 2.5rem; }

  .phase-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--rule);
  }

  .phase-number {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    font-weight: 400;
    font-style: italic;
    line-height: 1;
    flex-shrink: 0;
    margin-top: -4px;
  }

  .phase-number.p1 { color: var(--phase1); }
  .phase-number.p2 { color: var(--phase2); }
  .phase-number.p3 { color: var(--phase3); }

  .phase-title-block {}
  .phase-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .phase-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }

  /* PIECE CARD */
  .piece-card {
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .piece-card:hover { border-color: var(--ink-soft); }
  .piece-card.listened { border-color: var(--green); }
  .piece-card.listened .piece-row { background: var(--green-light); }

  .piece-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    cursor: pointer;
    user-select: none;
  }

  /* CHECKBOX */
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--rule);
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    cursor: pointer;
    flex-shrink: 0;
  }

  .check-box svg { display: none; pointer-events: none; }
  .listened .check-box { background: var(--green); border-color: var(--green); }
  .listened .check-box svg { display: block; }

  /* PIECE INFO */
  .piece-info { flex: 1; min-width: 0; }

  .piece-composer {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    margin-bottom: 2px;
  }

  .piece-name {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 5px;
  }

  .piece-tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 3px;
    font-weight: 500;
  }

  .tag-duration { background: var(--paper-warm); color: var(--ink-soft); border: 1px solid var(--rule); }
  .tag-form { background: var(--gold-light); color: #7a5f1a; }
  .tag-gateway { background: #fff8e0; color: #8a6500; border: 1px solid #e0c840; }
  .tag-era { background: var(--paper-warm); color: var(--ink-soft); }

  .piece-chevron {
    flex-shrink: 0;
    color: var(--ink-muted);
    transition: transform 0.2s;
  }

  .piece-card.open .piece-chevron { transform: rotate(180deg); }

  /* EXPANDED DETAILS */
  .piece-details {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--rule);
  }

  .piece-card.open .piece-details { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 14px;
  }

  @media (max-width: 560px) { .detail-grid { grid-template-columns: 1fr; } }

  .detail-block {}

  .detail-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 5px;
  }

  .detail-text {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.65;
  }

  .detail-text strong { color: var(--ink); font-weight: 500; }

  .detail-full {
    margin-top: 14px;
    grid-column: 1 / -1;
  }

  .performers-list { display: flex; flex-direction: column; gap: 5px; }

  .performer-row {
    display: flex;
    gap: 8px;
    align-items: baseline;
  }

  .performer-tag {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    min-width: 26px;
    flex-shrink: 0;
  }

  .performer-name { font-size: 13px; color: var(--ink); }

  .apple-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 8px 16px;
    background: var(--ink);
    color: white;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: opacity 0.15s;
  }

  .apple-link:hover { opacity: 0.8; }

  .apple-link svg { flex-shrink: 0; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--ink-muted);
  }

  .empty-state p { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-style: italic; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem 1.5rem;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    color: var(--ink-muted);
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="site-label">Your Classical Music Journey</div>

</div>

<main id="main"></main>

<footer>
  Your progress saves automatically in this browser. Start with the ★ gateway pieces.
</footer>

const PHASE_INFO = {
  1: { label: 'Phase 1', title: 'Recognition & Pleasure', desc: 'Works you\'ve probably already heard fragments of your whole life. Listen to them complete and consciously. Goal: match whole works to names, composers, and the feeling of each era.', color: 'var(--phase1)' },
  2: { label: 'Phase 2', title: 'Form & Structure', desc: 'Start asking how things work. Learn the difference between a symphony, concerto, sonata, and quartet. Begin to hear architecture, not just sound.', color: 'var(--phase2)' },
  3: { label: 'Phase 3', title: 'Challenge & Reward', desc: 'These pieces require context from Phases 1 and 2 to fully land. Harder to access, deeper rewards. Some take multiple listens; some need a synopsis first.', color: 'var(--phase3)' }
};

function loadListened() {
  try { return JSON.parse(localStorage.getItem('classical_listened') || '{}'); } catch(e) { return {}; }
}

function saveListened(obj) {
  localStorage.setItem('classical_listened', JSON.stringify(obj));
}

let listened = loadListened();
let activeFilter = 'all';
let searchQuery = '';
let openCard = null;

function toggleListened(id, e) {
  e.stopPropagation();
  e.preventDefault();
  if (listened[id]) {
    delete listened[id];
  } else {
    listened[id] = true;
  }
  saveListened(listened);
  renderAll();
}

function toggleCard(id) {
  openCard = openCard === id ? null : id;
  renderAll();
}

function getFiltered() {
  return PIECES.filter(p => {
    if (activeFilter === 'p1' && p.phase !== 1) return false;
    if (activeFilter === 'p2' && p.phase !== 2) return false;
    if (activeFilter === 'p3' && p.phase !== 3) return false;
    if (activeFilter === 'listened' && !listened[p.id]) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return p.composer.toLowerCase().includes(q) || p.name.toLowerCase().includes(q) || p.best.toLowerCase().includes(q) || p.era.toLowerCase().includes(q) || p.form.toLowerCase().includes(q);
    }
    return true;
  });
}

function renderAll() {
  updateProgress();
  renderPieces();
}

function updateProgress() {
  const total = PIECES.length;
  const done = Object.keys(listened).length;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = done + ' of ' + total;
}

function renderPieces() {
  const filtered = getFiltered();
  const main = document.getElementById('main');

  if (!filtered.length) {
    main.innerHTML = '<div class="empty-state"><p>Nothing matches — try a different filter.</p></div>';
    return;
  }

  const phaseGroups = {};
  filtered.forEach(p => {
    if (!phaseGroups[p.phase]) phaseGroups[p.phase] = [];
    phaseGroups[p.phase].push(p);
  });

  let html = '';
  [1,2,3].forEach(ph => {
    if (!phaseGroups[ph]) return;
    const info = PHASE_INFO[ph];
    const colorClass = 'p' + ph;
    html += `<section class="phase-section">
      <div class="phase-header">
        <div class="phase-number ${colorClass}">${ph}</div>
        <div class="phase-title-block">
          <div class="phase-title">${info.title}</div>
          <div class="phase-desc">${info.desc}</div>
        </div>
      </div>`;

    phaseGroups[ph].forEach(p => {
      const isListened = !!listened[p.id];
      const isOpen = openCard === p.id;
      html += `<div class="piece-card${isListened ? ' listened' : ''}${isOpen ? ' open' : ''}" id="card_${p.id}">
        <div class="piece-row" onclick="toggleCard('${p.id}')">
          <div class="check-box" onclick="toggleListened('${p.id}', event)" title="${isListened ? 'Mark as unlistened' : 'Mark as listened'}" role="checkbox" aria-checked="${isListened}" tabindex="0">
            <svg width="12" height="12" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="piece-info">
            <div class="piece-composer">${p.composer}</div>
            <div class="piece-name">${p.name}</div>
            <div class="piece-tags">
              <span class="tag tag-duration">⏱ ${p.duration}</span>
              <span class="tag tag-form">${p.form}</span>
              <span class="tag tag-era">${p.era}</span>
              ${p.gateway ? '<span class="tag tag-gateway">★ Start here</span>' : ''}
            </div>
          </div>
          <svg class="piece-chevron" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="piece-details">
          <div class="detail-grid">
            <div class="detail-block">
              <div class="detail-label">What is it?</div>
              <div class="detail-text"><strong>${p.form}</strong> — ${p.era} — <strong>${p.duration}</strong></div>
            </div>
            <div class="detail-block">
              <div class="detail-label">Who & when?</div>
              <div class="detail-text">${p.who} Written: <strong>${p.when}</strong></div>
            </div>
            <div class="detail-block detail-full">
              <div class="detail-label">Why listen to this?</div>
              <div class="detail-text">${p.why}</div>
            </div>
            <div class="detail-block detail-full">
              <div class="detail-label">Context</div>
              <div class="detail-text">${p.context}</div>
            </div>
            <div class="detail-block detail-full">
              <div class="detail-label">Recommended recording</div>
              <div class="performers-list">
                <div class="performer-row"><span class="performer-tag">Best</span><span class="performer-name">${p.best}</span></div>
                <div class="performer-row"><span class="performer-tag">Alt</span><span class="performer-name">${p.alt}</span></div>
              </div>
              <a class="apple-link" href="https://music.apple.com/search?term=${encodeURIComponent(p.apple)}" target="_blank" rel="noopener">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                Search on Apple Music
              </a>
            </div>
          </div>
        </div>
      </div>`;
    });

    html += '</section>';
  });

  main.innerHTML = html;
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.className = 'filter-btn');
    const f = this.dataset.filter;
    activeFilter = f;
    const cls = f === 'all' ? 'active-all' : f === 'listened' ? 'active-listened' : 'active-' + f;
    this.classList.add(cls);
    openCard = null;
    renderAll();
  });
});

document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value.trim();
  openCard = null;
  renderAll();
});

renderAll();
</script>
